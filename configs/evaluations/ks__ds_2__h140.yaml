  - controller_checkpoint_path
  - intermediate_weight
  - evaluation_trajectories
  - metrics.rmse_domain
  - metrics.physics_domain
  - metrics.aggregation
  unresolved_fields: []
  notes:
  - Seeds, metric aggregation order, and reporting units are repository settings.
  - Horizon counts forecast states and excludes the supplied initial state.
