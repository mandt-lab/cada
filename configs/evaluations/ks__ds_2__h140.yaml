kind: evaluation
config_id: evaluation.ks.ds_2.h140
dataset:
  kind: dataset
  config_id: dataset.ks
  domain: ks
  physical_channels: 1
  channel_names:
  - u
  resolution:
  - 256
  physical_dt: 0.2
  physical_dt_unit: simulator_time
  prior_sequence_length: 140
  maximum_evaluation_horizon: 640
  train_data_path: ${CADA_ROOT}/data/ks/train.h5
  holdout_data_path: ${CADA_ROOT}/data/ks/holdout.h5
  hdf5_key: null
  data_sha256: null
  train_split: train
  holdout_split: test
  train_years: []
  holdout_years: []
  normalization:
    method: channelwise_minmax
    fit_split: paper_train
    statistics_path: ${CADA_ROOT}/data/ks/normalization.json
    applied_domain: model_input
  source_citation: Shysheya et al. [47]; Brandstetter et al. [56]
  source_version: null
  source_provenance:
    paper_reference: Paper Appendix F
    paper_fields:
    - physical_channels
    - channel_names
    - resolution
    - physical_dt
    - physical_dt_unit
    - prior_sequence_length
    - maximum_evaluation_horizon
    - source_citation
    repository_default_fields:
    - train_data_path
    - holdout_data_path
    - hdf5_key
    - train_split
    - holdout_split
    - normalization.*
    unresolved_fields:
    - data_sha256
    - source_version
    notes:
    - Split files, checksums, and PDE normalization follow the repository data pipeline.
prior_model:
  role: prior
  architecture: unet
  spatial_dims: 1
  physical_channels: 1
  base_width: 64
  channel_multipliers:
  - 1
  - 2
  - 4
  - 8
  learned_sinusoidal_embedding_dim: 128
  objective: pred_v
  beta_schedule: sigmoid
  train_diffusion_steps: 1000
  sampler: ddim
  sampling_steps: 3
prior_checkpoint_path: ${CADA_ROOT}/runs/ks/prior/paper/checkpoints/final.pt
controller_config_id: controller.ks.ds_2
controller_model:
  architecture: film_controlnet
  hidden_width: 768
  group_norm_groups: 8
controller_checkpoint_path: ${CADA_ROOT}/runs/ks/controller/ds_2/checkpoints/final.pt
gamma: 0.1
beta: 0.01
intermediate_weight: 1.0
evaluation_trajectories: 8
