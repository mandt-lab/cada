name: CPU CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src
      WANDB_MODE: disabled

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1
          python -m pip install \
            einops h5py matplotlib numpy pytest PyYAML ruff scipy xarray
          python -m pip install --no-deps --editable .

      - name: Lint
        run: ruff check src tests gencast_da

      - name: Test
        env:
          CADA_ROOT: ${{ runner.temp }}/cada
        run: python -m pytest -q -p no:cacheprovider

  gencast-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      JAX_PLATFORMS: cpu
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU controller dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --constraint gencast_da/requirements-linux-64-py310.lock \
            dm-haiku==0.0.17 \
            "graphcast @ git+https://github.com/google-deepmind/graphcast.git@08cf73625c9d12bd9aaa038868bcb2fe488f2a22" \
            jax==0.6.2 \
            jaxlib==0.6.2 \
            numpy==1.26.4 \
            optax \
            pytest \
            tqdm \
            xarray

      - name: Check GenCast controller
        run: |
          python -m gencast_da._check_cada_controller
          python -m pytest -q gencast_da/tests/test_jax_logic.py
