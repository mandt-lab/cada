kind: controller
config_id: gencast.controller.ms16_smoke
stage: controller
module: gencast_da.train_cada_controller
data_root: ${GENCAST_DATA_ROOT}
parameters:
  num-steps: 1
  num-noise-levels: 4
  rollout-K: 4
  rollout-loss-mode: mean
  learning-rate: 0.0002
  weight-decay: 0.0001
  grad-clip: 1.0
  gamma: 1.0
  hidden-channels: 128
  num-blocks: 8
  sigma-emb-dim: 128
  obs-lat-stride-deg: 16
  obs-lon-stride-deg: 16
  obs-mask-mode: stride
  w-t: 1.0
  w-full: 0.5
  w-obs: 5.0
  w-s: 0.0
  w-c: 0.0
  w-reg: 0.0
  log-every: 1
  val-every: 1
  save-every: 1
  seed: 0
seeds:
  training: 0
  observation: 11
  diffusion: 0
notes:
  - One-update smoke test using the full MS16 production training path.
